name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Typecheck & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            dashboard/backend/package-lock.json
            dashboard/frontend/package-lock.json

      - name: Backend typecheck
        run: |
          cd dashboard/backend
          npm ci
          npx prisma generate
          npm run build

      - name: Frontend typecheck
        run: |
          cd dashboard/frontend
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.wecircle.helpers-tech.com/api
          NEXT_PUBLIC_AWS_REGION: us-east-1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}

  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd dashboard/frontend
          npm ci
          npm run build
          zip -r ../../frontend_build.zip .next public package.json package-lock.json next.config.mjs
        env:
          NEXT_PUBLIC_API_URL: https://api.wecircle.helpers-tech.com/api
          NEXT_PUBLIC_AWS_REGION: us-east-1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend to EC2
        run: |
          scp -i ~/.ssh/id_rsa frontend_build.zip ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/frontend_build.zip
          ssh -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} 'bash -s' << 'ENDSSH'
          cd /home/ec2-user/wecircle-frontend
          unzip -o /home/ec2-user/frontend_build.zip
          npm install --production --ignore-scripts

          # Delete ONLY frontend processes (loop to catch duplicates)
          while pm2 delete frontend 2>/dev/null; do echo "deleted a frontend process"; done
          # Kill anything still holding port 3000
          fuser -k 3000/tcp 2>/dev/null || true
          sleep 2

          # Start fresh single frontend instance
          pm2 start npm --name frontend -- start
          pm2 save
          pm2 list
          ENDSSH


      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/wecircle
            sudo chown -R ec2-user:ec2-user /opt/wecircle
            git pull origin main
            
            cd dashboard/backend
            
            # Securely inject Cognito pool IDs and JWT secrets from GitHub secrets into server .env
            sed -i '/^JWT_SECRET=/d' .env 2>/dev/null || true
            sed -i '/^COGNITO_USER_POOL_ID=/d' .env 2>/dev/null || true
            sed -i '/^COGNITO_CLIENT_ID=/d' .env 2>/dev/null || true
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}" >> .env
            echo "COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}" >> .env
            
            npm ci --only=production=false
            npx prisma generate

            # Pre-migration: NULL out Notification.recipientId rows that point to deleted Users.
            # Prevents the FK constraint addition in phase2_additions from failing on dirty data.
            echo 'UPDATE "Notification" SET "recipientId" = NULL WHERE "recipientId" IS NOT NULL AND "recipientId" NOT IN (SELECT id FROM "User");' | npx prisma db execute --stdin

            # Baseline the init migration on first deploy (no-op if already recorded).
            npx prisma migrate resolve --applied "20260529000000_init" 2>&1 || true

            # Apply all pending incremental migrations (idempotent).
            npx prisma migrate deploy

            npm run build

            pm2 delete backend 2>/dev/null || true
            pm2 start dist/server.js --name backend
            pm2 save
