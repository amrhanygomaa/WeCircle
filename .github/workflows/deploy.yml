name: Production Deployment

on:
  push:
    branches:
      - main
  # Manual trigger — used to deploy to ECS (Phase 4+) before Phase 5 cutover.
  # After cutover: remove workflow_dispatch and the EC2 deploy job; keep ECS only.
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'ec2'
        type: choice
        options: [ec2, ecs, both]

jobs:
  validate:
    name: Typecheck & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            dashboard/backend/package-lock.json
            dashboard/frontend/package-lock.json

      - name: Backend typecheck
        run: |
          cd dashboard/backend
          npm ci
          npx prisma generate
          npm run build

      - name: Frontend typecheck
        run: |
          cd dashboard/frontend
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.wecircle.helpers-tech.com/api
          NEXT_PUBLIC_AWS_REGION: us-east-1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}

  # ── EC2 deploy (current production path — remove after Phase 5 cutover) ────
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate
    # Run on every push to main OR when deploy_target is ec2/both.
    if: github.event_name == 'push' || inputs.deploy_target == 'ec2' || inputs.deploy_target == 'both'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend (static export)
        run: |
          cd dashboard/frontend
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.wecircle.helpers-tech.com/api
          NEXT_PUBLIC_AWS_REGION: us-east-1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy Frontend to S3 + invalidate CloudFront
        run: |
          aws s3 sync dashboard/frontend/out/ s3://${{ secrets.FRONTEND_S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          aws s3 sync dashboard/frontend/out/ s3://${{ secrets.FRONTEND_S3_BUCKET }} \
            --delete \
            --cache-control "no-cache" \
            --include "*.html"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"


      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/wecircle
            sudo chown -R ec2-user:ec2-user /opt/wecircle
            git pull origin main
            
            cd dashboard/backend
            
            # Securely inject Cognito pool IDs and JWT secrets from GitHub secrets into server .env
            sed -i '/^JWT_SECRET=/d' .env 2>/dev/null || true
            sed -i '/^COGNITO_USER_POOL_ID=/d' .env 2>/dev/null || true
            sed -i '/^COGNITO_CLIENT_ID=/d' .env 2>/dev/null || true
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}" >> .env
            echo "COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}" >> .env
            
            npm ci --only=production=false
            npx prisma generate

            # Pre-migration: NULL out Notification.recipientId rows that point to deleted Users.
            # Prevents the FK constraint addition in phase2_additions from failing on dirty data.
            echo 'UPDATE "Notification" SET "recipientId" = NULL WHERE "recipientId" IS NOT NULL AND "recipientId" NOT IN (SELECT id FROM "User");' | npx prisma db execute --stdin

            # Baseline the init migration on first deploy (no-op if already recorded).
            npx prisma migrate resolve --applied "20260529000000_init" 2>&1 || true

            # Apply all pending incremental migrations (idempotent).
            npx prisma migrate deploy

            npm run build

            pm2 delete backend 2>/dev/null || true
            pm2 start dist/server.js --name backend
            pm2 save

  # ── ECS deploy (Phase 4+ path — becomes the only deploy after Phase 5 cutover) ──
  # Prerequisites before first run:
  #   1. Deploy CDK stacks: cdk deploy --all (from infra/cdk/)
  #   2. Add AWS_ROLE_ARN secret to GitHub (value from CDK output DeployRoleArn)
  #   3. Ensure the GitHub OIDC provider exists in your AWS account (see compute-stack.ts)
  #   4. Remove the long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets from GitHub
  deploy-ecs:
    name: Build & Deploy to ECS
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.deploy_target == 'ecs' || inputs.deploy_target == 'both'
    permissions:
      id-token: write   # Required for OIDC token generation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/wecircle-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/wecircle-backend:latest \
            ./dashboard/backend
          docker push $ECR_REGISTRY/wecircle-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/wecircle-backend:latest

      - name: Force ECS rolling deployment
        run: |
          aws ecs update-service \
            --cluster wecircle-cluster \
            --service wecircle-backend \
            --force-new-deployment \
            --region us-east-1
