name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd dashboard/frontend
          npm ci
          npm run build
          zip -r ../../frontend_build.zip .next public package.json package-lock.json next.config.mjs
        env:
          NEXT_PUBLIC_API_URL: https://api.wecircle.helpers-tech.com/api
          NEXT_PUBLIC_AWS_REGION: us-east-1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_IvG7IexJJ
          NEXT_PUBLIC_COGNITO_CLIENT_ID: 2meppogljnsldj9iivqf6d1p02

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend to EC2
        run: |
          scp -i ~/.ssh/id_rsa frontend_build.zip ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/frontend_build.zip
          ssh -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} "cd /home/ec2-user/wecircle-frontend && unzip -o /home/ec2-user/frontend_build.zip && npm install --production --ignore-scripts && pm2 delete frontend || true && pm2 start npm --name frontend -- start && pm2 save"

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/wecircle
            sudo chown -R ec2-user:ec2-user /opt/wecircle
            git pull origin main
            
            cd dashboard/backend
            npm ci --only=production=false
            npx prisma generate
            npm run build
            
            pm2 restart backend || pm2 start dist/server.js --name backend
            pm2 save
